auto_update:
  branch: live
  check_interval: daily
  enabled: true
  install_time: immediately
  remote: origin
cameras:
- id: cam_01
  name: Front Entrance
  enabled: true
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/main/av_stream
  source_sub: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream
  main_resolution:
  - 1920
  - 1080
  sub_resolution:
  - 640
  - 360
  native_fps: 25
- id: cam_02
  name: Lobby East
  enabled: false
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/main/av_stream
  source_sub: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream
  main_resolution:
  - 1920
  - 1080
  sub_resolution:
  - 640
  - 360
  native_fps: 25
face_db:
  path: data/face_db.json
plate_db:
  path: data/plate_db.json
models:
  human_detector:
    enabled: true
  pose_estimator:
    enabled: true
  face_recognizer:
    enabled: false
    match_threshold: 0.55
  license_plate_recognizer:
    enabled: false
    log_interval_s: 10
voyager:
  sdk_path: ~/voyager-sdk
  build_root: null
  networks_dir: customers/upside
  calibration_dir: data/calibration
  num_calibration_images: 400
  aipu_cores: 4
  hardware_decode: false # software decode (avdec_h264) prevents Rockchip MPP (rkvdec2) driver crashes
  rtsp_transport: all
  rtsp_latency_ms: 200
  low_latency: false
  aipu_clock_mhz: null # Native 800 MHz profile prevents kernel MSI interrupt timeouts
  mvm_utilization: null # Full MVM capacity prevents megakernel execution timeouts
  specified_frame_rate: 0 # 0 prevents videorate duplicate buffer crash (inplace_addstreamid)
  reconnect_interval_s: 5
  thresholds:
    person_conf: 0.4
    person_nms_iou: 0.45
    face_conf: 0.5
    max_faces_per_frame: 6
    min_face_px: 32
    plate_conf: 0.4
    max_plates_per_frame: 4
  tracker:
    max_age: 50
    min_hits: 3
    iou_threshold: 0.3
capacity:
  profile: auto
  target_utilization: 0.85
  derating: 0.6
  decode_mpx_per_s: 1000
  host_results_per_s: 400
  expected_faces: 2
  expected_plates: 1
  enable_tiling: false
  tile_overlap_pct: 10
  max_fps: 25
  model_fps:
    yolov8npose: 723
    yolov8spose: 471
    retinaface: 774
    facenet: 720
    plate_detector: 764
    lprnet: 1500
preview:
  fps: 12
  grid_fps: 6
  max_width: 1280
  jpeg_quality: 75
visualization:
  draw_boxes: true
  draw_faces: true
  draw_fps: true
  draw_pose: true
  draw_tracks: true
  draw_plates: true
  draw_zones: true
  window_name: Axelera Metis Multi-Camera Detection System
web:
  cert_file: data/ssl/cert.pem
  enabled: true
  host: 0.0.0.0
  https: true
  key_file: data/ssl/key.pem
  port: 8000
zone_crossing:
  enabled: false
  zones: []
