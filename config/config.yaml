auto_update:
  branch: live
  check_interval: daily
  enabled: true
  install_time: immediately
  remote: origin
cameras:
- enabled: true
  fps_limit: 30
  id: cam_01
  name: Front Entrance
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream
- enabled: false
  fps_limit: 30
  id: cam_02
  name: Lobby East
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream
face_db:
  path: data/face_db.json
hardware:
  chip_id: 0
  device: axelera
  num_cores: 4
  voyager_sdk: true
models:
  face_recognizer:
    conf_threshold: 0.5
    detector_axm: models/axm/yolov8n-face.axm
    detector_onnx: models/onnx/yolov8n-face.onnx
    embedder_axm: models/axm/arcface_mobilefacenet.axm
    embedder_onnx: models/onnx/arcface_mobilefacenet.onnx
    enabled: true
    input_size:
    - 112
    - 112
    match_threshold: 0.6
  human_detector:
    axm_path: models/axm/yolo11n_320.axm
    conf_threshold: 0.45
    enabled: true
    input_size:
    - 320
    - 320
    iou_threshold: 0.45
    model_name: yolo11n.pt
    model_profile: ultra_light
    onnx_path: models/onnx/yolo11n_320.onnx
    person_class_id: 0
  pose_estimator:
    axm_path: models/axm/yolov8n-pose.axm
    conf_threshold: 0.5
    enabled: true
    input_size:
    - 512
    - 512
    model_name: yolov8n-pose.pt
    num_keypoints: 17
    onnx_path: models/onnx/yolov8n-pose.onnx
performance:
  buffer_size: 1
  detect_interval: 2
  face_interval: 3
  pose_interval: 2
  rtsp_transport: tcp
tracking:
  enabled: true
  match_thresh: 0.8
  track_buffer: 30
  track_thresh: 0.5
  tracker_type: bytetrack
visualization:
  draw_boxes: true
  draw_faces: true
  draw_fps: true
  draw_pose: true
  draw_tracks: true
  window_name: Axelera Metis Multi-Camera Detection System
web:
  cert_file: data/ssl/cert.pem
  enabled: true
  host: 0.0.0.0
  https: true
  key_file: data/ssl/key.pem
  port: 8000
