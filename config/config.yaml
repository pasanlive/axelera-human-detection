auto_update:
  branch: live
  check_interval: daily
  enabled: true
  install_time: immediately
  remote: origin

cameras:
- enabled: true
  fps_limit: 30
  id: cam_01
  name: Front Entrance
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream
- enabled: false
  fps_limit: 30
  id: cam_02
  name: Lobby East
  source: rtsp://admin:ODPEDI@192.168.0.102:554/h264/ch1/sub/av_stream

face_db:
  path: data/face_db.json

plate_db:
  path: data/plate_db.json

hardware:
  chip_id: 0
  device: axelera
  num_cores: 4
  voyager_sdk: true

models:
  # ── Primary Models (enabled by default) ──────────────────────────────────
  human_detector:
    enabled: true
    model_profile: ultra_light
    model_name: yolov8n.pt
    onnx_path: models/onnx/yolov8n_320.onnx
    axm_path: models/axm/yolov8n_320.axm   # Optional: compile with Voyager SDK
    input_size: [320, 320]
    conf_threshold: 0.45
    iou_threshold: 0.45
    person_class_id: 0

  pose_estimator:
    enabled: true
    model_name: yolov8n-pose.pt
    onnx_path: models/onnx/yolov8n-pose.onnx
    axm_path: models/axm/yolov8n-pose.axm   # Optional: compile with Voyager SDK
    input_size: [512, 512]
    conf_threshold: 0.5
    num_keypoints: 17

  face_recognizer:
    enabled: true
    conf_threshold: 0.5
    # Face embedder (ArcFace MobileFaceNet)
    embedder_onnx: models/onnx/arcface_mobilefacenet.onnx
    embedder_axm: models/axm/arcface_mobilefacenet.axm   # Optional: compile with Voyager SDK
    input_size: [112, 112]
    match_threshold: 0.6
    # Note: face region detected via Haar cascade fallback (no separate YOLO face detector required)

  # ── Model Zoo: Detector Alternatives (disabled by default) ───────────────
  yolo11n_detector:
    enabled: false
    model_profile: yolo11_ultra_light
    model_name: yolo11n.pt
    onnx_path: models/onnx/yolo11n_320.onnx
    axm_path: models/axm/yolo11n_320.axm   # Optional: compile with Voyager SDK
    input_size: [320, 320]
    conf_threshold: 0.45
    iou_threshold: 0.45
    person_class_id: 0

  yolov5n_detector:
    enabled: false
    model_profile: extreme_light
    model_name: yolov5nu.pt
    onnx_path: models/onnx/yolov5n_320.onnx
    axm_path: models/axm/yolov5n_320.axm   # Optional: compile with Voyager SDK
    input_size: [320, 320]
    conf_threshold: 0.45
    iou_threshold: 0.45
    person_class_id: 0

  # ── Model Zoo: Pose Alternative (mutually exclusive with pose_estimator) ──
  keypoint_detector:
    enabled: false
    model_name: yolo11n-pose.pt
    onnx_path: models/onnx/yolo11n-pose_512.onnx
    axm_path: models/axm/yolo11n-pose_512.axm   # Optional: compile with Voyager SDK
    input_size: [512, 512]
    conf_threshold: 0.5
    num_keypoints: 17

  # ── Model Zoo: License Plate Recognition (disabled by default) ────────────
  license_plate_recognizer:
    enabled: false
    detector_onnx: models/onnx/yolov8n-plate.onnx
    detector_axm: models/axm/yolov8n-plate.axm   # Optional: compile with Voyager SDK
    ocr_onnx: models/onnx/crnn_plate_ocr.onnx
    ocr_axm: models/axm/crnn_plate_ocr.axm       # Optional: compile with Voyager SDK
    detector_input_size: [640, 640]
    ocr_input_size: [100, 32]
    conf_threshold: 0.45
    search_in_person_roi: false

performance:
  buffer_size: 1
  detect_interval: 2
  face_interval: 3
  pose_interval: 2
  rtsp_transport: tcp

tracking:
  enabled: true
  match_thresh: 0.8
  track_buffer: 30
  track_thresh: 0.5
  tracker_type: bytetrack

visualization:
  draw_boxes: true
  draw_faces: true
  draw_fps: true
  draw_pose: true
  draw_tracks: true
  draw_plates: true
  draw_zones: true
  window_name: Axelera Metis Multi-Camera Detection System

web:
  cert_file: data/ssl/cert.pem
  enabled: true
  host: 0.0.0.0
  https: true
  key_file: data/ssl/key.pem
  port: 8000

# ── Zone Crossing: absolute pixel coordinates per stream ───────────────────
# Each zone MUST specify camera_id. Cameras with no zones are unaffected.
zone_crossing:
  enabled: false
  zones: []
  # Example zone definitions (uncomment and edit to activate):
  # - id: zone_entrance
  #   name: "Main Entrance Line"
  #   type: line
  #   camera_id: cam_01
  #   points: [[0, 540], [1920, 540]]   # absolute pixels at stream resolution
  #   direction_labels: ["IN", "OUT"]
  #
  # - id: zone_restricted
  #   name: "Restricted Area"
  #   type: polygon
  #   camera_id: cam_01
  #   points: [[200,100],[800,100],[800,600],[200,600]]
  #   direction_labels: ["ENTER", "EXIT"]
